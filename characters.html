<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Персонажи — Династия Алмааз</title>

<style>
:root{
 --black:#080604;--coal:#120e0a;--panel:#18120d;--panel2:#211810;
 --gold:#c6a15a;--gold2:#efd79b;--ivory:#eee2c8;--muted:#b8aa91;
 --blood:#74121a;--line:rgba(198,161,90,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;min-height:100vh;color:var(--ivory);
 background:
  radial-gradient(circle at 50% 0,rgba(112,74,34,.15),transparent 28%),
  linear-gradient(180deg,#0d0907,#080604 55%,#040302);
 font-family:"Cormorant Infant",Georgia,serif;
}
body:
 <div class="bismillah">

    <div class="symbol">﷽</div>

    <div class="arabic">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>

</div>

<header>
 :before{
 content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.14;
 background-image:
  repeating-linear-gradient(45deg,transparent 0 42px,rgba(198,161,90,.09) 43px 44px),
  repeating-linear-gradient(-45deg,transparent 0 42px,rgba(198,161,90,.05) 43px 44px);
}
header{
 position:relative;padding:70px 20px 38px;text-align:center;
 border-bottom:1px solid var(--line);
 background:linear-gradient(180deg,rgba(0,0,0,.25),transparent);
 overflow:hidden;
}
header::before,header::after{
 content:"";position:absolute;top:24px;width:210px;height:1px;
 background:linear-gradient(90deg,transparent,var(--gold));
}
header::before{left:4%} header::after{right:4%;transform:scaleX(-1)}
.kicker{font-family:"Forum",serif;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);font-size:.72rem}
h1{font:400 clamp(3rem,8vw,6.6rem)/.9 "Almendra SC",serif;margin:14px 0;color:var(--gold2);text-shadow:0 8px 28px #000}
.lead{max-width:760px;margin:auto;color:#cdbd9e;font-size:1.2rem}
.nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}
.nav a{color:#e5d4b0;text-decoration:none;border:1px solid var(--line);padding:9px 14px;background:rgba(20,14,10,.72)}

.controls{
 position:sticky;top:0;z-index:100;
 display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;
 padding:14px max(18px,calc((100vw - 1240px)/2));
 background:rgba(8,6,4,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-bottom:1px solid var(--line);
}
input,select,button{
 width:100%;border:1px solid var(--line);background:#16100c;color:var(--ivory);
 padding:12px 13px;font:600 1rem "Cormorant Infant",serif;border-radius:3px;
}
button{cursor:pointer}
button:hover{border-color:var(--gold);background:#251a11}
.count{grid-column:1/-1;color:var(--muted);font-size:.95rem;padding-left:2px}

.grid{
 width:min(1240px,calc(100% - 28px));margin:30px auto 70px;
 display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:18px;
}
.card{
 position:relative;min-height:360px;overflow:hidden;cursor:pointer;
 border:1px solid var(--line);
 background:linear-gradient(160deg,#21170f,#0e0b08 70%);
 box-shadow:0 18px 50px rgba(0,0,0,.34);
 transition:.25s ease;
}
.card:hover{transform:translateY(-5px);border-color:rgba(239,215,155,.7);box-shadow:0 24px 60px rgba(0,0,0,.48)}
.portrait{
 height:205px;display:grid;place-items:center;position:relative;overflow:hidden;
 background:
  radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--accent) 42%,transparent),transparent 38%),
  linear-gradient(150deg,color-mix(in srgb,var(--accent) 28%,#0b0806),#080604 74%);
}
.portrait::before{
 content:"";position:absolute;width:120px;height:160px;border-radius:48% 48% 44% 44%;
 background:linear-gradient(180deg,rgba(238,226,200,.16),rgba(0,0,0,.34));
 box-shadow:0 0 0 1px rgba(239,215,155,.16),0 18px 30px rgba(0,0,0,.45);
}
.initials{position:relative;z-index:2;font:400 3.1rem "Almendra SC",serif;color:#f1ddae;text-shadow:0 5px 15px #000}
.badge{position:absolute;top:12px;right:12px;z-index:3;padding:5px 9px;border:1px solid var(--line);background:rgba(8,6,4,.78);font-size:.78rem;color:#e5c77d}
.card-body{padding:18px}
.card h2{font:400 1.75rem/1.05 "Almendra SC",serif;margin:0;color:#f1d99c}
.nick{color:#af9362;font-style:italic;margin:6px 0 12px}
.meta{display:flex;gap:7px;flex-wrap:wrap}
.meta span{font-size:.82rem;color:#c8b99f;border:1px solid rgba(198,161,90,.22);padding:5px 8px;background:rgba(255,255,255,.025)}
.magic{margin-top:13px;color:#ddd0b7;line-height:1.4}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:#bda989;border:1px solid var(--line)}

.modal{
 position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;
 padding:18px;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)
}
.modal.open{display:flex}
.sheet{
 width:min(980px,100%);max-height:92vh;overflow:auto;position:relative;
 border:1px solid rgba(198,161,90,.65);
 background:linear-gradient(145deg,#241910,#0e0b08 78%);
 box-shadow:0 30px 100px rgba(0,0,0,.72);
}
.close{position:sticky;top:12px;float:right;z-index:5;width:42px;height:42px;margin:12px;border-radius:50%;font-size:1.5rem}
.hero{display:grid;grid-template-columns:280px 1fr;min-height:300px;border-bottom:1px solid var(--line)}
.hero-portrait{display:grid;place-items:center;background:radial-gradient(circle at center,color-mix(in srgb,var(--accent) 42%,transparent),transparent 45%),#0b0806;min-height:300px}
.hero-portrait .initials{font-size:5rem}
.hero-copy{padding:35px 30px}
.type{color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:.72rem}
.hero h2{font:400 clamp(2.5rem,6vw,4.8rem)/.92 "Almendra SC",serif;margin:9px 0;color:#f1d99c}
.hero .nick{font-size:1.25rem}
.fact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);margin-top:22px}
.fact-grid div{background:#17110d;padding:11px 13px}
.fact-grid strong{display:block;color:#cba75f;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.details{padding:28px 30px 38px}
.details h3{font:400 1.55rem "Almendra SC",serif;color:#e8ca83;margin:24px 0 8px}
.details p{color:#d8ccb4;line-height:1.65;margin:0}
.info-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
.info{border:1px solid rgba(198,161,90,.25);padding:14px;background:rgba(255,255,255,.025)}
.info b{display:block;color:#caa45c;margin-bottom:5px}

@media(max-width:760px){
 .controls{grid-template-columns:1fr 1fr;padding:10px}
 .controls input{grid-column:1/-1}
 .controls button{grid-column:1/-1}
 .hero{grid-template-columns:1fr}
 .hero-portrait{min-height:210px}
 .hero-copy{padding:24px 20px}
 .fact-grid,.info-list{grid-template-columns:1fr}
 .details{padding:22px 20px 30px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:calc(100% - 16px)}
 .card{min-height:320px}
 .portrait{height:165px}
 .card-body{padding:14px}
 .card h2{font-size:1.35rem}
}
@media(max-width:460px){
 .grid{grid-template-columns:1fr}
 .portrait{height:190px}
}

/* PALACE EXPERIENCE */
body{
  background:
    radial-gradient(circle at 50% -10%,rgba(130,92,42,.18),transparent 31%),
    linear-gradient(180deg,#0c0907 0%,#080604 48%,#040302 100%);
}
.palace-bg{
  position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden;
}
.marble{
  position:absolute;inset:0;opacity:.36;
  background:
    linear-gradient(115deg,transparent 0 37%,rgba(255,255,255,.035) 38%,transparent 39%),
    linear-gradient(72deg,transparent 0 63%,rgba(198,161,90,.04) 64%,transparent 65%),
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.025),transparent 24%),
    radial-gradient(circle at 80% 70%,rgba(255,255,255,.018),transparent 28%);
  background-size:320px 320px,420px 420px,100% 100%,100% 100%;
  filter:contrast(1.15);
}
.palace-columns{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,.75) 0 5%,
      rgba(91,63,31,.17) 5.2% 7.5%,
      transparent 8% 92%,
      rgba(91,63,31,.17) 92.5% 94.8%,
      rgba(0,0,0,.75) 95% 100%);
}
.palace-arches{
  position:absolute;left:4%;right:4%;top:0;height:36vh;
  border:1px solid rgba(198,161,90,.09);
  border-radius:0 0 48% 48%;
  box-shadow:inset 0 -45px 90px rgba(0,0,0,.25);
}
.eastern-pattern{
  position:absolute;inset:0;opacity:.13;
  background-image:
    linear-gradient(45deg,transparent 46%,rgba(198,161,90,.34) 47% 53%,transparent 54%),
    linear-gradient(-45deg,transparent 46%,rgba(198,161,90,.22) 47% 53%,transparent 54%);
  background-size:86px 86px;
}
.fog-layer,.fog-layer-2{
  position:fixed;left:-25%;width:150%;height:28%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 60%,rgba(188,180,161,.15),transparent 34%),
    radial-gradient(ellipse at 52% 55%,rgba(165,158,145,.11),transparent 31%),
    radial-gradient(ellipse at 84% 62%,rgba(188,180,161,.14),transparent 35%);
  filter:blur(18px);
}
.fog-layer{bottom:0;animation:palaceFog 34s ease-in-out infinite alternate}
.fog-layer-2{top:24%;opacity:.45;animation:palaceFog2 46s ease-in-out infinite alternate}
@keyframes palaceFog{from{transform:translateX(-4%)}to{transform:translateX(8%)}}
@keyframes palaceFog2{from{transform:translateX(7%)}to{transform:translateX(-8%)}}
.ash{
  position:fixed;inset:0;pointer-events:none;z-index:80;opacity:.22;
  background-image:
    radial-gradient(circle,rgba(224,209,180,.75) 0 1px,transparent 1.4px),
    radial-gradient(circle,rgba(153,132,102,.48) 0 1px,transparent 1.5px);
  background-size:120px 120px,175px 175px;
  background-position:0 0,45px 35px;
  animation:ashFall 24s linear infinite;
}
@keyframes ashFall{to{background-position:80px 220px,190px 300px}}
.candle{
  position:fixed;bottom:14%;z-index:30;width:10px;height:90px;border-radius:3px;
  background:linear-gradient(90deg,#5b4227,#d0aa68,#6f4f2f);
  box-shadow:0 0 10px rgba(215,174,93,.18);
}
.candle::before{
  content:"";position:absolute;left:50%;top:-22px;width:14px;height:26px;
  transform:translateX(-50%);
  border-radius:50% 50% 45% 45%;
  background:radial-gradient(circle at 50% 65%,#fff5bf 0 14%,#f4b149 30%,#9c4218 58%,transparent 62%);
  filter:drop-shadow(0 0 10px rgba(255,178,72,.85));
  animation:flame 1.8s ease-in-out infinite alternate;
}
.candle-left{left:3%}.candle-right{right:3%}
@keyframes flame{from{transform:translateX(-50%) rotate(-2deg) scaleY(.95)}to{transform:translateX(-50%) rotate(3deg) scaleY(1.08)}}

.audio-dock{
  position:fixed;right:14px;bottom:14px;z-index:150;
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border:1px solid var(--line);
  background:rgba(13,9,7,.86);backdrop-filter:blur(10px);
}
.audio-dock button{width:auto;padding:8px 12px}
.audio-dock span{color:#cbb893;font-size:.9rem}

.quick-filters{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  margin:18px auto 0;max-width:1050px;
}
.quick-filter{
  width:auto;border-radius:999px;padding:9px 13px;
  background:rgba(22,16,12,.88);
}
.quick-filter.active{
  background:linear-gradient(180deg,#4a3521,#24170f);
  border-color:#e0bd73;color:#fff0c2;
  box-shadow:0 0 16px rgba(198,161,90,.18);
}

/* Golden living cards */
.card{
  border:1px solid rgba(198,161,90,.52);
  box-shadow:
    0 18px 50px rgba(0,0,0,.42),
    inset 0 0 0 5px rgba(198,161,90,.035);
}
.card::before{
  content:"";position:absolute;inset:7px;z-index:5;pointer-events:none;
  border:1px solid rgba(198,161,90,.18);
}
.card::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 32%,rgba(241,215,155,.14),transparent 34%);
  transition:.25s ease;
}
.card:hover::after,.card.touched::after{opacity:1}
.card:hover,.card.touched{
  border-color:#e5c77f;
  box-shadow:0 24px 62px rgba(0,0,0,.55),0 0 22px rgba(198,161,90,.2),inset 0 0 0 5px rgba(198,161,90,.055);
}
.portrait::after{
  content:"";position:absolute;left:50%;top:42%;width:50px;height:8px;
  transform:translate(-50%,-50%);opacity:0;
  background:
    radial-gradient(circle at 18% 50%,rgba(255,231,141,.95) 0 2px,transparent 3px),
    radial-gradient(circle at 82% 50%,rgba(255,231,141,.95) 0 2px,transparent 3px);
  filter:drop-shadow(0 0 6px rgba(255,209,94,.9));
  transition:.25s ease;
}
.card:hover .portrait::after,.card.touched .portrait::after{opacity:1}
.card .card-body{transform:translateY(9px);transition:.25s ease}
.card:hover .card-body,.card.touched .card-body{transform:translateY(0)}
.card .card-body h2,.card .nick{opacity:.78;transition:.25s ease}
.card:hover .card-body h2,.card:hover .nick,.card.touched .card-body h2,.card.touched .nick{opacity:1}

/* Scroll opening */
.sheet{
  transform:scale(.9) rotateX(8deg);
  transform-origin:center;
  opacity:0;
}
.modal.open .sheet{
  animation:scrollOpen .55s cubic-bezier(.2,.75,.2,1) forwards;
}
@keyframes scrollOpen{
  0%{transform:scale(.82) rotateX(14deg);opacity:0}
  70%{transform:scale(1.02) rotateX(0);opacity:1}
  100%{transform:scale(1);opacity:1}
}
.sheet::before,.sheet::after{
  content:"";position:absolute;left:16px;right:16px;height:18px;z-index:4;pointer-events:none;
  background:linear-gradient(180deg,#7a5a33,#c7a35d 45%,#4c351f);
  border-radius:999px;box-shadow:0 5px 14px rgba(0,0,0,.4);
}
.sheet::before{top:-9px}.sheet::after{bottom:-9px}

.icon-strip{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:8px;margin-top:26px;
}
.icon-item{
  text-align:center;border:1px solid rgba(198,161,90,.24);
  background:rgba(255,255,255,.025);padding:12px 8px;
}
.icon-item span{display:block;font-size:1.35rem;margin-bottom:4px}
.icon-item small{color:#c6b593}

@media(max-width:760px){
 .candle{display:none}
 .audio-dock{left:10px;right:10px;bottom:10px;justify-content:center}
 .icon-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
 .quick-filters{padding:0 10px;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
 .quick-filter{white-space:nowrap}
}


.real-portrait{
 position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;
 filter:saturate(.88) contrast(1.06) brightness(.82);
 transition:transform .5s ease,filter .35s ease;
}
.card:hover .real-portrait,.card.touched .real-portrait{
 transform:scale(1.045);
 filter:saturate(1.02) contrast(1.08) brightness(.93);
}
.portrait.has-image::before{display:none}
.portrait.has-image .initials{display:none}
.hero-portrait.has-image{overflow:hidden}
.hero-portrait.has-image .initials{display:none}
.hero-real-portrait{
 width:100%;height:100%;min-height:300px;object-fit:cover;object-position:center top;
 filter:saturate(.9) contrast(1.07) brightness(.85);
}
@media(max-width:760px){
 .hero-real-portrait{min-height:260px;max-height:420px}
}

</style>
</head>

 "color": "#77633a", "image": "character-images/lorkan-sunnar.jpg"}, {"name": "Мекбуда и Мебсуда", "nickname": "Близнецы", "age": "16", "birthday": "23 Мухаррам", "state": "Королевство Алхан", "faction": "Алхан", "role": "Наследницы", "status": "Живы", "magic": "Мекбуда — земля; Мебсуда — ветер", "weakness": "Друг друга; Мекбуда боится темноты и молнии, Мебсуда — воды", "weapon": "Терра-посох и кинжалы", "emerdal": "Лабрадор и аметист", "appearance": "Длинные каштановые волосы и зелёные глаза", "height": "1,74 м", "personality": "Мекбуда спокойная и справедливая; Мебсуда неуравновешенная и не контролирует гнев.", "goal": "Свобода и неприкосновенность.", "relations": "В будущем связаны с близнецами гикксосами.", "family": "Мать, отец и младшая сестра.", "color": "#5f7f64", "image": "character-images/mekbuda-i-mebsuda.jpg"}];
const grid=document.getElementById("grid");
const search=document.getElementById("search");
const stateFilter=document.getElementById("stateFilter");
const roleFilter=document.getElementById("roleFilter");
const count=document.getElementById("count");
const modal=document.getElementById("modal");
let quickKind="all";
const palaceAudio=document.getElementById("palaceAudio");
const musicBtn=document.getElementById("musicBtn");

function initials(name){
 return name.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
}
function optionList(select,values){
 [...new Set(values)].sort((a,b)=>a.localeCompare(b,"ru")).forEach(v=>{
   const o=document.createElement("option");o.value=v;o.textContent=v;select.appendChild(o);
 });
}
optionList(stateFilter,characters.map(c=>c.state));
optionList(roleFilter,characters.map(c=>c.role));

function card(c,index){
 const el=document.createElement("article");
 el.className="card";
 el.style.setProperty("--accent",c.color);
 el.innerHTML=`
  <div class="portrait ${c.image?"has-image":""}">
   ${c.image?`<img class="real-portrait" src="${c.image}" alt="${c.name}" loading="lazy">`:""}
   <span class="badge">${c.status}</span>
   <span class="initials">${initials(c.name)}</span>
  </div>
  <div class="card-body">
   <h2>${c.name}</h2>
   <div class="nick">${c.nickname}</div>
   <div class="meta"><span>${c.state}</span><span>${c.role}</span></div>
   <div class="magic">${c.magic}</div>
  </div>`;
 el.addEventListener("touchstart",()=>el.classList.add("touched"),{passive:true});
 el.addEventListener("touchend",()=>setTimeout(()=>el.classList.remove("touched"),700),{passive:true});
 el.addEventListener("click",()=>openModal(c));
 return el;
}

function matchQuick(c){
 const s=(c.state+" "+c.role+" "+c.magic+" "+c.emerdal+" "+c.family).toLowerCase();
 if(quickKind==="all") return true;
 if(quickKind==="empire") return /император|фараон|шахбулат|импер/.test(s);
 if(quickKind==="kingdom") return /королев|киан|санджар|алхан/.test(s);
 if(quickKind==="military") return /командир|разведчик|воин|арм|рота|главнокоманд/.test(s);
 if(quickKind==="magic") return !/нет|не использовала/.test(c.magic.toLowerCase());
 if(quickKind==="emerdal") return !/нет эмердалов|не раскрыт/.test(c.emerdal.toLowerCase());
 if(quickKind==="family") return c.family && c.family.length>8;
 return true;
}
function render(){
 const q=search.value.trim().toLowerCase();
 const state=stateFilter.value, role=roleFilter.value;
 const filtered=characters.filter(c=>{
   const hay=[c.name,c.nickname,c.magic,c.weapon,c.emerdal,c.state,c.role,c.faction].join(" ").toLowerCase();
   return (!q||hay.includes(q))&&(!state||c.state===state)&&(!role||c.role===role)&&matchQuick(c);
 });
 grid.innerHTML="";
 if(!filtered.length){
   grid.innerHTML='<div class="empty">Персонажи не найдены.</div>';
 } else filtered.forEach((c,i)=>grid.appendChild(card(c,i)));
 count.textContent=`Показано: ${filtered.length} из ${characters.length}`;
}
[search,stateFilter,roleFilter].forEach(el=>el.addEventListener("input",render));
document.getElementById("resetBtn").addEventListener("click",()=>{
 search.value="";stateFilter.value="";roleFilter.value="";render();
});

function openModal(c){
 document.getElementById("modalPortrait").style.setProperty("--accent",c.color);
 const modalPortrait=document.getElementById("modalPortrait");
 modalPortrait.classList.toggle("has-image",Boolean(c.image));
 modalPortrait.querySelectorAll(".hero-real-portrait").forEach(x=>x.remove());
 if(c.image){
  const img=document.createElement("img");
  img.className="hero-real-portrait";
  img.src=c.image;
  img.alt=c.name;
  modalPortrait.prepend(img);
 }
 document.getElementById("modalInitials").textContent=initials(c.name);
 document.getElementById("modalType").textContent=`${c.state} · ${c.role}`;
 document.getElementById("modalName").textContent=c.name;
 document.getElementById("modalNick").textContent=c.nickname;
 document.getElementById("modalPersonality").textContent=c.personality;
 document.getElementById("modalGoal").textContent=c.goal;
 const facts=[["Возраст",c.age],["День рождения",c.birthday],["Рост",c.height],["Статус",c.status]];
 document.getElementById("factGrid").innerHTML=facts.map(x=>`<div><strong>${x[0]}</strong>${x[1]}</div>`).join("");
 const info=[
  ["Сила",c.magic],["Слабость",c.weakness],["Оружие",c.weapon],["Эмердал",c.emerdal],
  ["Внешность",c.appearance],["Отношения",c.relations],["Семья",c.family],["Фракция",c.faction]
 ];
 document.getElementById("infoList").innerHTML=info.map(x=>`<div class="info"><b>${x[0]}</b>${x[1]}</div>`).join("");
 const icons=[
  ["⚔","Оружие",c.weapon],
  ["💎","Эмердал",c.emerdal],
  ["👨‍👩‍👧","Семья",c.family],
  ["◈","Статус",c.status],
  ["🏛","Государство",c.state]
 ];
 document.getElementById("iconStrip").innerHTML=icons.map(x=>`<div class="icon-item" title="${x[2]}"><span>${x[0]}</span><small>${x[1]}</small></div>`).join("");
 modal.classList.add("open");modal.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";
}
function closeModal(){
 modal.classList.remove("open");modal.setAttribute("aria-hidden","true");document.body.style.overflow="";
}
document.getElementById("closeBtn").addEventListener("click",closeModal);
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

document.querySelectorAll(".quick-filter").forEach(btn=>{
 btn.addEventListener("click",()=>{
  document.querySelectorAll(".quick-filter").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  quickKind=btn.dataset.kind;
  render();
 });
});

musicBtn.addEventListener("click",async()=>{
 try{
  if(palaceAudio.paused){
   await palaceAudio.play();
   musicBtn.textContent="❚❚ Пауза";
  }else{
   palaceAudio.pause();
   musicBtn.textContent="▶ Музыка";
  }
 }catch(e){
  musicBtn.textContent="▶ Нажмите ещё раз";
 }
});
render();
</script>
</body>
</html>
