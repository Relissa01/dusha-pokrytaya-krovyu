<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090705">
<title>Династия Алмааз — Душа, покрытая кровью</title>
<link href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=Amiri:wght@400;700&family=Cormorant+Infant:wght@400;500;600;700&family=Forum&display=swap" rel="stylesheet">
<style>
:root{
 --night:#050408;--coal:#0d0a0d;--gold:#d0ad63;--gold2:#f2d99d;
 --ivory:#eee3cb;--line:rgba(208,173,99,.35);--wine:#4b111d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{
 color:var(--ivory);
 font-family:"Cormorant Infant",Georgia,serif;
 background:#050408;
}
.city{
 position:fixed;inset:0;z-index:-5;overflow:hidden;
 background:
  radial-gradient(circle at 50% 18%,rgba(231,177,92,.20),transparent 19%),
  linear-gradient(180deg,#312335 0%,#6c443a 35%,#271923 61%,#08060a 100%);
 transition:filter 1.1s ease,background 1.1s ease;
}
.sun,.moon{
 position:absolute;left:50%;top:13%;width:90px;height:90px;border-radius:50%;
 transform:translateX(-50%);transition:opacity 1s ease;
}
.sun{background:#ffe1a0;box-shadow:0 0 65px rgba(255,190,93,.75)}
.moon{opacity:0;background:#e8e4dd;box-shadow:0 0 50px rgba(205,214,255,.45)}
.sky-stars{
 position:absolute;inset:0;opacity:0;
 background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px);
 background-size:95px 95px;transition:opacity 1s;
}
.sky-clouds{
 position:absolute;left:-20%;top:18%;width:140%;height:28%;
 background:
  radial-gradient(ellipse at 12% 50%,rgba(255,229,198,.18),transparent 34%),
  radial-gradient(ellipse at 48% 45%,rgba(255,229,198,.12),transparent 32%),
  radial-gradient(ellipse at 84% 50%,rgba(255,229,198,.16),transparent 35%);
 filter:blur(17px);animation:clouds 34s ease-in-out infinite alternate;
}
@keyframes clouds{to{transform:translateX(8%)}}
.silhouette{
 position:absolute;left:-4%;right:-4%;bottom:0;height:58%;
 background:
  linear-gradient(90deg,transparent 0 4%,#09070a 4% 8%,transparent 8% 14%,#0a0709 14% 23%,transparent 23% 29%,#090709 29% 39%,transparent 39% 43%,#080608 43% 58%,transparent 58% 64%,#090709 64% 75%,transparent 75% 81%,#080608 81% 92%,transparent 92%),
  linear-gradient(180deg,transparent 0 36%,#090708 37% 100%);
 clip-path:polygon(0 55%,5% 50%,8% 20%,11% 50%,18% 47%,21% 12%,24% 47%,33% 43%,36% 25%,39% 43%,47% 39%,50% 4%,53% 39%,62% 42%,65% 18%,68% 42%,76% 46%,79% 10%,82% 46%,90% 50%,94% 24%,97% 51%,100% 55%,100% 100%,0 100%);
}
.lights{
 position:absolute;left:4%;right:4%;bottom:4%;height:35%;opacity:.7;
 background-image:
  radial-gradient(circle,#e0a74a 0 2px,transparent 3px),
  radial-gradient(circle,#d88936 0 1px,transparent 2px);
 background-size:87px 53px,131px 79px;
 animation:twinkle 3.2s ease-in-out infinite alternate;
}
@keyframes twinkle{to{opacity:.95;filter:brightness(1.25)}}
.overlay{
 position:fixed;inset:0;z-index:-2;
 background:
  linear-gradient(180deg,rgba(2,2,4,.04),rgba(3,2,4,.44) 60%,rgba(2,2,3,.88)),
  radial-gradient(circle at center,transparent 10%,rgba(0,0,0,.46) 100%);
}
.ornament{
 position:fixed;inset:18px;z-index:50;pointer-events:none;
 border:1px solid rgba(208,173,99,.27);
 box-shadow:inset 0 0 0 6px rgba(208,173,99,.025);
}
.ornament::before,.ornament::after{
 content:"◆";position:absolute;top:-11px;color:#d0ad63;background:#080609;padding:0 15px;
}
.ornament::before{left:10%}.ornament::after{right:10%}
.bismillah{
 position:relative;text-align:center;padding:28px 55px 8px;z-index:20;
}
.bismillah .symbol{
 font:400 46px/1 "Amiri",serif;color:var(--gold);
 text-shadow:0 0 22px rgba(208,173,99,.42)
}
.bismillah .arabic{
 margin-top:5px;font:400 clamp(20px,3vw,31px)/1.35 "Amiri",serif;
 direction:rtl;color:#f1dfb5
}
.hero{
 position:relative;z-index:20;text-align:center;padding:4vh 20px 20px;
}
.kicker{font-family:"Forum",serif;letter-spacing:.35em;text-transform:uppercase;color:#d3b878;font-size:.72rem}
h1{
 margin:15px 0 8px;font:400 clamp(3.6rem,10vw,8rem)/.86 "Almendra SC",serif;
 color:var(--gold2);text-shadow:0 10px 35px #000,0 0 25px rgba(208,173,99,.15)
}
.subtitle{font-size:clamp(1.05rem,2.1vw,1.4rem);color:#d2c4aa;max-width:740px;margin:auto}
.mode{
 position:fixed;right:22px;top:20px;z-index:80;
 border:1px solid var(--line);padding:8px 12px;
 background:rgba(8,6,9,.76);backdrop-filter:blur(10px);color:#e5d3aa
}
.menu{
 position:relative;z-index:20;
 width:min(1080px,calc(100% - 28px));margin:25px auto 65px;
 display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;
}
.card{
 position:relative;display:block;text-decoration:none;text-align:center;
 padding:20px 13px;color:#eadfc8;
 border:1px solid var(--line);
 background:linear-gradient(145deg,rgba(29,20,17,.86),rgba(9,7,10,.9));
 backdrop-filter:blur(8px);box-shadow:0 14px 35px rgba(0,0,0,.36);
 transition:.24s ease;font-size:1.12rem;font-weight:700;
}
.card::before{content:"";position:absolute;inset:5px;border:1px solid rgba(208,173,99,.09)}
.card:hover,.card:focus{transform:translateY(-5px);border-color:#e1c477;color:#fff1bf;box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 19px rgba(208,173,99,.15)}
.card.enter{grid-column:1/-1;font:400 1.55rem "Almendra SC",serif;border-color:rgba(232,203,128,.65);background:linear-gradient(180deg,rgba(78,48,27,.91),rgba(28,18,17,.94))}
.eagle{
 position:fixed;z-index:200;left:-26vw;bottom:13%;font-size:clamp(80px,13vw,155px);
 filter:brightness(.05) drop-shadow(0 20px 25px rgba(0,0,0,.8));
 opacity:0;pointer-events:none;transform:rotate(-7deg);
}
.eagle.fly{animation:eagleFlight 2.7s cubic-bezier(.18,.7,.15,1) forwards}
@keyframes eagleFlight{
 0%{left:-25vw;bottom:8%;opacity:0;transform:scale(.65) rotate(-8deg)}
 12%{opacity:1}
 48%{left:40vw;bottom:40%;transform:scale(1.05) rotate(2deg)}
 100%{left:112vw;bottom:75%;opacity:.9;transform:scale(1.65) rotate(-4deg)}
}
.transition-curtain{
 position:fixed;inset:0;z-index:190;background:#030205;opacity:0;pointer-events:none;
}
.transition-curtain.active{animation:curtain 2.7s ease forwards}
@keyframes curtain{0%,48%{opacity:0}100%{opacity:1}}
.sand{
 position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;
 background-image:radial-gradient(circle,rgba(232,191,117,.7) 0 1px,transparent 1.5px);
 background-size:34px 34px;animation:sandMove 1s linear infinite;
}
@keyframes sandMove{to{background-position:70px 22px}}
body.storm .sand{opacity:.42}
body.night .moon{opacity:1} body.night .sun{opacity:0} body.night .sky-stars{opacity:.65}
body.winter .city{filter:saturate(.55) brightness(.86) hue-rotate(12deg)}
body.morning .city{filter:brightness(1.05) saturate(1.04)}
body.sunset .city{filter:sepia(.18) saturate(1.25) hue-rotate(-7deg)}
body.night .city{filter:brightness(.43) saturate(.72) hue-rotate(15deg)}
body.storm .city{filter:sepia(.58) contrast(.78) brightness(.66) blur(.4px)}
@media(max-width:760px){
 body{overflow:auto}.ornament{inset:7px}.mode{top:auto;bottom:8px;right:8px;font-size:.8rem}
 .bismillah{padding-top:22px}.bismillah .symbol{font-size:36px}
 .hero{padding-top:2vh}.menu{grid-template-columns:1fr 1fr;margin-bottom:80px}.card.enter{grid-column:1/-1}
}
@media(max-width:460px){.menu{grid-template-columns:1fr}.card.enter{grid-column:auto}h1{font-size:3.7rem}}
@media(prefers-reduced-motion:reduce){.sky-clouds,.lights,.sand{animation:none}.eagle.fly{animation-duration:.8s}.transition-curtain.active{animation-duration:.8s}}
</style>
</head>
<body>
<div class="city" id="city">
 <div class="sun"></div><div class="moon"></div><div class="sky-stars"></div>
 <div class="sky-clouds"></div><div class="silhouette"></div><div class="lights"></div>
</div>
<div class="overlay"></div><div class="sand"></div><div class="ornament"></div>
<div class="mode" id="mode"></div>
<div class="bismillah">
 <div class="symbol">﷽</div>
 <div class="arabic" lang="ar" dir="rtl">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
</div>
<header class="hero">
 <div class="kicker">Душа, покрытая кровью</div>
 <h1>Династия Алмааз</h1>
 <p class="subtitle">Добро пожаловать в мир тёмного восточного фэнтези, древних династий, Эмердалов и Великого Свода.</p>
</header>
<nav class="menu">
 <a class="card enter" href="world.html" id="enter">🦅 Войти в мир</a>
 <a class="card" href="world.html">🗺 Карта мира</a>
 <a class="card" href="characters.html">👤 Персонажи</a>
 <a class="card" href="emerdals.html">💎 Эмердалы</a>
 <a class="card" href="empires.html">👑 Империи и Королевства</a>
 <a class="card" href="codex.html">📜 Великий Свод</a>
</nav>
<div class="eagle" id="eagle" aria-hidden="true">🦅</div>
<div class="transition-curtain" id="curtain"></div>
<script>
const modes=[
 {key:"morning",label:"☀ Утро",weight:35},
 {key:"sunset",label:"🌅 Закат",weight:25},
 {key:"night",label:"🌙 Ночь",weight:20},
 {key:"storm",label:"🌪 Песчаная буря",weight:15},
 {key:"winter",label:"❄ Зима",weight:5}
];
function chooseMode(){
 const total=modes.reduce((s,m)=>s+m.weight,0);
 let value=Math.random()*total;
 for(const mode of modes){value-=mode.weight;if(value<=0)return mode}
 return modes[0];
}
const selected=chooseMode();
document.body.classList.add(selected.key);
document.getElementById("mode").textContent=selected.label;

document.getElementById("enter").addEventListener("click",event=>{
 event.preventDefault();
 const eagle=document.getElementById("eagle");
 const curtain=document.getElementById("curtain");
 eagle.classList.add("fly");
 curtain.classList.add("active");
 const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 setTimeout(()=>location.href="world.html",reduced?850:2700);
});
</script>
</body>
</html>
