<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0908">
<title>Династия Алмааз — Тёмная карта мира</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=Cormorant+Infant:wght@400;500;600;700&family=Forum&display=swap" rel="stylesheet">

<style>
:root{
 --void:#090807;
 --coal:#15110e;
 --ash:#2a2119;
 --bronze:#735b3b;
 --gold:#c6a15a;
 --ivory:#e9dfc9;
 --parchment:#c9b99b;
 --glass:rgba(15,12,10,.9);
 --glass2:rgba(32,24,18,.92);
 --line:rgba(198,161,90,.48);
}
*{box-sizing:border-box}
html,body,#map{height:100%;margin:0}
body{
 overflow:hidden;
 background:#080706;
 color:var(--ivory);
 font-family:"Cormorant Infant",Georgia,serif;
}
#map{position:absolute;inset:0;background:#0b0908}
.leaflet-image-layer{
 filter:sepia(.34) saturate(.72) contrast(1.18) brightness(.68);
}
#map::before{
 content:"";
 position:absolute;inset:0;z-index:400;pointer-events:none;
 background:
   radial-gradient(circle at 48% 45%,transparent 34%,rgba(8,6,5,.42) 75%,rgba(3,3,3,.72) 100%),
   linear-gradient(180deg,rgba(98,70,38,.08),rgba(0,0,0,.16) 42%,rgba(0,0,0,.38));
 mix-blend-mode:multiply;
}
#map::after{
 content:"";
 position:absolute;inset:0;z-index:401;pointer-events:none;opacity:.16;
 background-image:
   radial-gradient(circle,rgba(230,214,180,.23) 0 1px,transparent 1.4px),
   linear-gradient(45deg,transparent 48%,rgba(198,161,90,.13) 49%,transparent 50%);
 background-size:110px 110px,72px 72px;
}
.ember-glow{
 position:absolute;inset:0;z-index:404;pointer-events:none;opacity:.18;
 background:
  radial-gradient(circle at 18% 74%,rgba(139,77,26,.28),transparent 18%),
  radial-gradient(circle at 78% 20%,rgba(166,113,46,.19),transparent 20%);
 animation:emberPulse 8s ease-in-out infinite alternate;
}
@keyframes emberPulse{from{opacity:.12}to{opacity:.25}}

.fog,.fog2{
 position:absolute;left:-30%;width:160%;height:36%;z-index:406;pointer-events:none;
 background:
  radial-gradient(ellipse at 20% 50%,rgba(180,173,157,.18),transparent 36%),
  radial-gradient(ellipse at 55% 40%,rgba(155,149,138,.13),transparent 31%),
  radial-gradient(ellipse at 85% 55%,rgba(184,175,158,.14),transparent 32%);
 filter:blur(18px);
}
.fog{top:0;opacity:.48;animation:fogMove 38s ease-in-out infinite alternate}
.fog2{top:27%;opacity:.22;animation:fogMove2 52s ease-in-out infinite alternate}
@keyframes fogMove{from{transform:translateX(-4%)}to{transform:translateX(9%)}}
@keyframes fogMove2{from{transform:translateX(7%)}to{transform:translateX(-8%)}}

.topbar{
 position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:1000;
 display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
 width:min(920px,calc(100% - 30px))
}
.layer-btn,.utility-btn{
 border:1px solid var(--line);
 background:rgba(17,13,10,.9);
 color:var(--ivory);
 padding:10px 14px;
 border-radius:3px;
 font:600 1rem "Cormorant Infant",serif;
 cursor:pointer;
 backdrop-filter:blur(12px);
 -webkit-backdrop-filter:blur(12px);
 transition:.2s;
 box-shadow:0 8px 24px rgba(0,0,0,.28);
}
.layer-btn:hover,.utility-btn:hover,.layer-btn.active{
 background:linear-gradient(180deg,#4f3b25,#2f2318);
 color:#fff2cf;
 border-color:rgba(198,161,90,.82);
 transform:translateY(-1px);
}
.layer-btn.active{box-shadow:0 0 0 2px rgba(198,161,90,.12),0 10px 28px rgba(0,0,0,.34)}

.intro{
 position:absolute;left:18px;top:82px;z-index:950;
 width:min(360px,calc(100% - 36px));
 padding:20px;
 background:linear-gradient(145deg,var(--glass2),var(--glass));
 border:1px solid var(--line);
 box-shadow:0 22px 65px rgba(0,0,0,.56);
 backdrop-filter:blur(14px);
 -webkit-backdrop-filter:blur(14px);
}
.intro::before,.detail-card::before{
 content:"";
 position:absolute;inset:8px;
 border:1px solid rgba(198,161,90,.18);
 pointer-events:none;
}
.intro .eyebrow{
 text-align:center;
 color:var(--gold);
 letter-spacing:.34em;
 text-transform:uppercase;
 font-size:.66rem;
}
.intro h1{
 margin:7px 0 2px;
 text-align:center;
 font:400 2.55rem/1 "Almendra SC",serif;
 color:#f1dfb9;
 text-shadow:0 5px 18px #000;
}
.intro .subtitle{
 text-align:center;
 color:#bfa678;
 font:1.08rem "Forum",serif;
 letter-spacing:.08em;
}
.ornament{
 display:flex;align-items:center;gap:10px;justify-content:center;
 color:var(--gold);margin:13px 0;
}
.ornament::before,.ornament::after{
 content:"";height:1px;width:80px;
 background:linear-gradient(90deg,transparent,var(--gold));
}
.ornament::after{transform:scaleX(-1)}
.intro p{line-height:1.56;color:#d8cdb8;margin:8px 0}
.audio-wrap{display:flex;align-items:center;gap:8px;margin-top:13px}
.audio-wrap audio{width:100%;height:34px;filter:grayscale(1) sepia(.25)}

.detail-card{
 position:absolute;right:18px;top:82px;z-index:980;
 width:min(400px,calc(100% - 36px));
 max-height:calc(100vh - 105px);
 overflow:auto;
 padding:22px;
 background:linear-gradient(145deg,rgba(39,29,21,.97),rgba(13,11,9,.98));
 border:1px solid rgba(198,161,90,.68);
 box-shadow:0 24px 75px rgba(0,0,0,.62);
 transform:translateX(115%);
 opacity:0;
 transition:.34s ease;
}
.detail-card.open{transform:translateX(0);opacity:1}
.detail-card h2{
 font:400 2.25rem/1 "Almendra SC",serif;
 color:#ecd6a4;
 margin:8px 0 5px;
}
.detail-card .type{
 color:#b8985e;
 text-transform:uppercase;
 letter-spacing:.17em;
 font-size:.72rem;
}
.detail-card p{line-height:1.62;color:#d8cdb8}
.detail-grid{
 display:grid;
 grid-template-columns:110px 1fr;
 gap:8px 12px;
 border-top:1px solid var(--line);
 padding-top:13px;
}
.detail-grid strong{color:#d0ad68}
.close-card{
 position:sticky;top:0;float:right;
 border:1px solid var(--line);
 background:#211810;color:#f4e7ca;
 border-radius:50%;width:34px;height:34px;cursor:pointer;
}

.realm-marker,.icon-marker,.sea-label{
 display:flex;align-items:center;justify-content:center;cursor:pointer
}
.realm-marker{
 width:24px;height:24px;border-radius:50%;
 border:2px solid #d6b56f;
 background:rgba(40,28,18,.94);
 box-shadow:0 0 0 6px rgba(198,161,90,.12),0 0 20px rgba(198,161,90,.62);
 animation:pulse 2.8s ease-in-out infinite;
}
@keyframes pulse{
 50%{transform:scale(1.12);box-shadow:0 0 0 10px rgba(198,161,90,.04),0 0 28px rgba(198,161,90,.72)}
}
.icon-marker{
 width:34px;height:34px;border-radius:50%;
 background:rgba(24,18,14,.92);
 border:1px solid rgba(198,161,90,.72);
 box-shadow:0 7px 20px rgba(0,0,0,.42);
 font-size:20px;
 animation:floatIcon 3.8s ease-in-out infinite;
}
@keyframes floatIcon{50%{transform:translateY(-6px)}}
.sea-label{
 min-width:140px;padding:7px 11px;
 border:1px solid rgba(198,161,90,.42);
 background:rgba(17,13,10,.78);
 color:#d9c49a;border-radius:3px;
 font:1rem "Forum",serif;
 letter-spacing:.08em;
 text-shadow:0 2px 6px #000;
}
.leaflet-popup-content-wrapper{
 color:#eadfc9;
 background:linear-gradient(145deg,#302219,#16110d);
 border:1px solid rgba(198,161,90,.72);
 border-radius:3px;
 box-shadow:0 16px 45px rgba(0,0,0,.5);
}
.leaflet-popup-tip{background:#1b140f}
.leaflet-popup-content{
 font-family:"Cormorant Infant",serif;
 font-size:1rem;line-height:1.5;
}
.leaflet-control-zoom a{
 color:#e9d8b2!important;
 background:#1a140f!important;
 border-color:rgba(198,161,90,.42)!important;
}
.leaflet-control-attribution{display:none}

.bottom-tools{
 position:absolute;left:18px;bottom:18px;z-index:950;
 display:flex;gap:8px;flex-wrap:wrap;
}
.utility-btn{border-radius:3px}

@media(max-width:780px){
 .topbar{top:8px;overflow-x:auto;justify-content:flex-start;flex-wrap:nowrap;padding-bottom:4px}
 .layer-btn{white-space:nowrap}
 .intro{top:64px;left:10px;width:calc(100% - 20px);max-height:34vh;overflow:auto;padding:15px}
 .intro h1{font-size:2rem}
 .detail-card{top:auto;right:10px;bottom:10px;width:calc(100% - 20px);max-height:56vh}
 .bottom-tools{left:10px;bottom:10px}
}
</style>
</head>
<body>

<div id="map"></div>
<div class="ember-glow"></div>
<div class="fog"></div>
<div class="fog2"></div>

<div class="topbar">
 <button class="layer-btn active" data-layer="all">Все</button>
 <button class="layer-btn" data-layer="empires">Империи</button>
 <button class="layer-btn" data-layer="kingdoms">Королевства</button>
 <button class="layer-btn" data-layer="religion">Религия</button>
 <button class="layer-btn" data-layer="history">История</button>
</div>

<aside class="intro" id="intro">
 <div class="eyebrow">Летопись мира</div>
 <h1>Династия Алмааз</h1>
 <div class="subtitle">Тёмная карта восточных земель</div>
 <div class="ornament">◆</div>
 <p><b>Религия мира — ислам.</b> Вера определяет право, образование, придворный этикет и повседневную жизнь.</p>
 <p><b>Главный конфликт:</b> борьба Гиксосов и Руис за власть, торговые пути и право определять будущее Династии Алмааз.</p>
 <div class="audio-wrap">
  <audio controls loop preload="metadata">
   <source src="dark_eastern_ambient.wav" type="audio/wav">
  </audio>
 </div>
</aside>

<aside class="detail-card" id="detailCard">
 <button class="close-card" id="closeCard">×</button>
 <div class="type" id="cardType">Тип</div>
 <h2 id="cardTitle">Название</h2>
 <div class="ornament">◆</div>
 <p id="cardHistory"></p>
 <div class="detail-grid" id="cardGrid"></div>
</aside>

<div class="bottom-tools">
 <button class="utility-btn" id="homeBtn">Общий вид</button>
 <button class="utility-btn" id="introBtn">Скрыть летопись</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const W=1536,H=1024,bounds=[[0,0],[H,W]];
const map=L.map("map",{crs:L.CRS.Simple,minZoom:-2,maxZoom:4,zoomSnap:.25,wheelPxPerZoomLevel:85,attributionControl:false});
L.imageOverlay("map.jpeg",bounds).addTo(map);
map.fitBounds(bounds);
map.setMaxBounds([[-180,-240],[H+180,W+240]]);

const groups={
 empires:L.layerGroup().addTo(map),
 kingdoms:L.layerGroup().addTo(map),
 religion:L.layerGroup().addTo(map),
 history:L.layerGroup().addTo(map),
 seas:L.layerGroup().addTo(map),
 icons:L.layerGroup().addTo(map)
};

const cards={
 "ruis":{
  type:"Столица и вольный город",
  title:"Руис",
  history:"Руис вырос на пересечении караванных дорог и речных переправ. Город стал политическим сердцем мира, но его богатство сделало его главной целью Гиксосов. Двор Руис удерживает равновесие между империями, торговыми домами и религиозными учёными.",
  facts:[["Правитель","Амир Фарид ибн Рашан"],["Армия","Гвардия Золотого полумесяца, городское ополчение и конные разведчики"],["Население","Купцы, ремесленники, учёные, дипломаты и переселенцы"],["Значение","Центр дипломатии, торговли и борьбы против Гиксосов"]]
 },
 "shahn":{
  type:"Империя",title:"Империя Шахнвулат",
  history:"Древняя западная держава, выросшая вокруг священного дерева и горных святилищ. Шахнвулат славится библиотеками, лекарями и хранителями редких Эмердалов. Имперский двор придерживается строгого церемониала и поддерживает Руис.",
  facts:[["Столица","Шахр-Нур"],["Правитель","Императрица Саира аль-Вулат"],["Сила","Учёные, лекари, мастера Эмердалов"],["Отношение к Руис","Союзник"]]
 },
 "veksultan":{
  type:"Империя",title:"Империя Вексултан",
  history:"Северная горная империя, защищённая ледяными перевалами и каменными крепостями. Её правители считают порядок выше милосердия. Вексултан официально сохраняет нейтралитет, но часть знати тайно торгует оружием.",
  facts:[["Столица","Кара-Векс"],["Правитель","Султан Арслан IV"],["Армия","Тяжёлая конница и горные легионы"],["Позиция","Нейтралитет с тайными сделками"]]
 },
 "said":{
  type:"Империя",title:"Империя Саид",
  history:"Южная крепостная держава у моря Искандар. Её богатство основано на портах, металле и караванной торговле. Саид поддерживает Руис, но требует взамен доступ к северным рынкам.",
  facts:[["Столица","Саид-Кала"],["Правитель","Император Джалал ад-Дин"],["Армия","Крепостные полки и морская стража"],["Богатство","Порты, металл, караваны"]]
 },
 "kian":{
  type:"Королевство",title:"Королевство Киан",
  history:"Восточное королевство садов, морских бухт и купеческих домов. Киан избегает открытой войны, предпочитая дипломатию и торговлю.",
  facts:[["Столица","Киан-Сарай"],["Правитель","Король Самир аль-Киан"],["Сила","Флот и торговые дома"],["Позиция","Осторожный нейтралитет"]]
 },
 "alkhan":{
  type:"Королевство",title:"Королевство Алкхан",
  history:"Государство башен и проливов, контролирующее важнейшие морские проходы. Алкхан известен мастерами навигации и морской разведкой.",
  facts:[["Столица","Аль-Ханир"],["Правитель","Королева Мейра Алхан"],["Армия","Морская стража и башенные гарнизоны"],["Позиция","Союзник Руис"]]
 },
 "sanjar":{
  type:"Королевство",title:"Королевство Санжар",
  history:"Западные долины Санжара лежат на пути караванов. Здесь чтят гостеприимство, родовую честь и слово, данное перед свидетелями. Королевство расколото между сторонниками Руис и агентами Гиксосов.",
  facts:[["Столица","Санжар"],["Правитель","Король Хасан ибн Малик"],["Сила","Караванные союзы и лёгкая конница"],["Проблема","Внутренний раскол"]]
 },
 "religion":{
  type:"Религия",title:"Ислам в Династии Алмааз",
  history:"Ислам объединяет земли общей верой, но различные школы права и придворные традиции придают каждой державе собственный характер. Мечети служат местами молитвы, образования, благотворительности и общественной жизни.",
  facts:[["Священные места","Главные мечети Руис, Шахр-Нура и Аль-Ханира"],["Учёные","Кади, имамы, переписчики и наставники"],["Влияние","Право, календарь, образование, дипломатия"]]
 },
 "conflict":{
  type:"История",title:"Война Гиксосов и Руис",
  history:"Конфликт начался с борьбы за контроль над караванными дорогами и переправами. Гиксосы стремятся подчинить Руис и превратить его в военную столицу. Руис отвечает союзами, дипломатией и мобилизацией городских гильдий.",
  facts:[["Причина","Торговые пути, власть и наследие"],["Стороны","Гиксосы против Руис и союзников"],["Последствия","Разорённые дороги, дипломатические кризисы, рост армий"]]
 },
 "riellan":{
  type:"Море и легенда",title:"Океан Риеллан",
  history:"Моряки рассказывают, что в безлунные ночи над водой появляется серебряная дорога. Корабль, который последует по ней, либо достигнет далёкого берега за одну ночь, либо исчезнет навсегда.",
  facts:[["Опасность","Холодные туманы"],["Легенда","Серебряная дорога"],["Пути","Северо-западные торговые маршруты"]]
 },
 "rieman":{
  type:"Море и легенда",title:"Океан Риеман",
  history:"Глубокое северное море. По преданию, под его водами лежит затонувший дворец первой династии, а его купола видны лишь во время великого отлива.",
  facts:[["Опасность","Рифы и ледяные течения"],["Легенда","Затонувший дворец"],["Пути","Вексултан и северные гавани"]]
 },
 "iskandar":{
  type:"Море и легенда",title:"Океан Искандар",
  history:"Тёплое западное море, где купцы ориентируются по звёздам и старым песням. Считается, что имя каждого погибшего моряка однажды возвращается эхом с волн.",
  facts:[["Опасность","Внезапные штормы"],["Легенда","Эхо погибших моряков"],["Пути","Порты Саида и западные земли"]]
 },
 "selmegin":{
  type:"Море и легенда",title:"Океан Сельмегин",
  history:"Юго-восточное море известно золотыми закатами и быстрыми течениями. Легенда говорит о корабле без команды, который появляется перед падением великой династии.",
  facts:[["Опасность","Сильные течения"],["Легенда","Корабль-предвестник"],["Пути","Алкхан и восточная торговля"]]
 }
};

const card=document.getElementById("detailCard");
function showCard(key){
 const d=cards[key]; if(!d)return;
 document.getElementById("cardType").textContent=d.type;
 document.getElementById("cardTitle").textContent=d.title;
 document.getElementById("cardHistory").textContent=d.history;
 document.getElementById("cardGrid").innerHTML=d.facts.map(x=>`<strong>${x[0]}</strong><span>${x[1]}</span>`).join("");
 card.classList.add("open");
}
document.getElementById("closeCard").onclick=()=>card.classList.remove("open");

function dotIcon(){return L.divIcon({className:"",html:'<div class="realm-marker"></div>',iconSize:[24,24],iconAnchor:[12,12]})}
function emojiIcon(e){return L.divIcon({className:"",html:`<div class="icon-marker">${e}</div>`,iconSize:[34,34],iconAnchor:[17,17]})}
function seaIcon(label){return L.divIcon({className:"",html:`<div class="sea-label">${label}</div>`,iconSize:[150,36],iconAnchor:[75,18]})}
function addPoint(group,x,y,key,icon=dotIcon()){
 const m=L.marker([y,x],{icon}).addTo(group);
 m.on("click",()=>showCard(key));
 return m;
}

addPoint(groups.history,730,500,"ruis");
addPoint(groups.empires,270,270,"shahn");
addPoint(groups.empires,1015,210,"veksultan");
addPoint(groups.empires,470,690,"said");
addPoint(groups.kingdoms,1295,315,"kian");
addPoint(groups.kingdoms,1275,565,"alkhan");
addPoint(groups.kingdoms,170,455,"sanjar");

addPoint(groups.religion,985,440,"religion",emojiIcon("🕌"));
addPoint(groups.religion,735,535,"religion",emojiIcon("🕌"));
addPoint(groups.religion,420,745,"religion",emojiIcon("🕌"));

addPoint(groups.history,785,520,"conflict",emojiIcon("⚔️"));
addPoint(groups.icons,1010,245,"veksultan",emojiIcon("🏰"));
addPoint(groups.icons,700,520,"ruis",emojiIcon("🏯"));
addPoint(groups.icons,450,725,"said",emojiIcon("🏰"));
addPoint(groups.icons,330,610,"sanjar",emojiIcon("🐪"));
addPoint(groups.icons,580,570,"ruis",emojiIcon("🐪"));

addPoint(groups.seas,170,110,"riellan",seaIcon("Океан Риеллан"));
addPoint(groups.seas,590,170,"rieman",seaIcon("Океан Риеман"));
addPoint(groups.seas,210,820,"iskandar",seaIcon("Океан Искандар"));
addPoint(groups.seas,1290,820,"selmegin",seaIcon("Океан Сельмегин"));

const allGroups=["empires","kingdoms","religion","history","seas","icons"];
function setLayer(mode){
 allGroups.forEach(k=>{if(map.hasLayer(groups[k]))map.removeLayer(groups[k])});
 if(mode==="all") allGroups.forEach(k=>groups[k].addTo(map));
 if(mode==="empires"){groups.empires.addTo(map);groups.icons.addTo(map)}
 if(mode==="kingdoms"){groups.kingdoms.addTo(map);groups.icons.addTo(map)}

document.querySelectorAll(".layer-btn").forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll(".layer-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  setLayer(btn.dataset.layer);
 }
});

document.getElementById("homeBtn").onclick=()=>map.fitBounds(bounds);
const intro=document.getElementById("intro"),introBtn=document.getElementById("introBtn");
introBtn.onclick=()=>{
 const hidden=intro.style.display==="none";
 intro.style.display=hidden?"block":"none";
 introBtn.textContent=hidden?"Скрыть летопись":"Показать летопись";
};
